name: Build

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Download native host dependencies
        run: go mod download all
      - name: Formatting
        run: test -z "$(gofmt -l main.go internal tests .github/scripts)"
      - name: Production tests
        run: go test ./... ./.github/scripts/...
      - name: Native host integration
        run: go test -tags debug ./...
      - name: Race detector
        run: go test -tags debug -race ./...
      - name: Vet
        run: go vet -tags debug ./... ./.github/scripts/...
      - name: Validate tagged release notes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          go run ./.github/scripts/release-notes -notes RELEASE_NOTES.md -tag "$RELEASE_TAG" -out "$RUNNER_TEMP/release-notes.md"
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
            ext: so
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            ext: so
          - os: darwin
            arch: amd64
            runner: macos-15-intel
            ext: dylib
          - os: darwin
            arch: arm64
            runner: macos-15
            ext: dylib
          - os: windows
            arch: amd64
            runner: windows-2025
            ext: dll
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build library and package
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
          LIB_EXT: ${{ matrix.ext }}
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          version=0.0.0-dev
          if [[ "$REF_TYPE" == tag ]]; then version="${RELEASE_TAG#v}"; fi
          mkdir -p dist
          library="dist/cpa-opencode.$LIB_EXT"
          archive="dist/cpa-opencode_${version}_${TARGET_OS}_${TARGET_ARCH}.zip"
          CGO_ENABLED=1 GOOS="$TARGET_OS" GOARCH="$TARGET_ARCH" go build -trimpath -buildmode=c-shared \
            -ldflags "-s -w -X github.com/dillonzq/cpa-opencode/internal/plugin.pluginVersion=$version" -o "$library" .
          go run ./.github/scripts/package-release.go -library "$library" -archive "$archive" -checksum "$archive.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: cpa-opencode-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v5
        with:
          pattern: cpa-opencode-*
          merge-multiple: true
          path: release-assets
      - name: Prepare release notes
        run: go run ./.github/scripts/release-notes -notes RELEASE_NOTES.md -tag "$RELEASE_TAG" -out "$RUNNER_TEMP/release-notes.md"
      - name: Verify release packages
        working-directory: release-assets
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          for target in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64 windows_amd64; do
            archive="cpa-opencode_${version}_${target}.zip"
            test -s "$archive"
            test -s "$archive.sha256"
            sha256sum --check --strict "$archive.sha256"
            unzip -t "$archive"
          done
      - name: Create or update release draft
        run: |
          set -euo pipefail
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft'); then
            if [[ "$draft" != true ]]; then
              echo "Refusing to modify an already published release: $RELEASE_TAG" >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" release-assets/*.zip release-assets/*.sha256 --clobber
            gh release edit "$RELEASE_TAG" --draft --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$RELEASE_TAG" release-assets/*.zip release-assets/*.sha256 \
              --draft --verify-tag --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
