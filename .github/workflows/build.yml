name: Build

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Download native host dependencies
        run: go mod download all
      - name: Formatting
        run: test -z "$(gofmt -l main.go internal tests .github/scripts)"
      - name: Production tests
        run: go test ./... ./.github/scripts/...
      - name: Native host integration
        run: go test -tags debug ./...
      - name: Race detector
        run: go test -tags debug -race ./...
      - name: Vet
        run: go vet -tags debug ./... ./.github/scripts/...
      - name: Validate tagged release notes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          go run ./.github/scripts/release-notes -notes RELEASE_NOTES.md -tag "$RELEASE_TAG" -out "$RUNNER_TEMP/release-notes.md"
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
            ext: so
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            ext: so
          - os: darwin
            arch: amd64
            runner: macos-15-intel
            ext: dylib
          - os: darwin
            arch: arm64
            runner: macos-15
            ext: dylib
          - os: windows
            arch: amd64
            runner: windows-2025
            ext: dll
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build library and package
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
          LIB_EXT: ${{ matrix.ext }}
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          version=0.0.0-dev
          if [[ "$REF_TYPE" == tag ]]; then version="${RELEASE_TAG#v}"; fi
          mkdir -p dist
          library="dist/cpa-opencode.$LIB_EXT"
          archive="dist/cpa-opencode_${version}_${TARGET_OS}_${TARGET_ARCH}.zip"
          CGO_ENABLED=1 GOOS="$TARGET_OS" GOARCH="$TARGET_ARCH" go build -trimpath -buildmode=c-shared \
            -ldflags "-s -w -X github.com/dillonzq/cpa-opencode/internal/plugin.pluginVersion=$version" -o "$library" .
          go run ./.github/scripts/package-release.go -library "$library" -archive "$archive" -checksum dist/checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cpa-opencode-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/checksums.txt
          if-no-files-found: error

  build-windows-arm64:
    needs: test
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          version=0.0.0-dev
          if [[ "$REF_TYPE" == tag ]]; then version="${RELEASE_TAG#v}"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build library
        timeout-minutes: 45
        uses: go-cross/cgo-actions@v1
        env:
          GOFLAGS: -trimpath -buildmode=c-shared
        with:
          dir: .
          packages: .
          targets: windows-arm64
          out-dir: dist/windows-arm64
          output: cpa-opencode.dll
          flags: -ldflags=-s -w
          x-flags: github.com/dillonzq/cpa-opencode/internal/plugin.pluginVersion=${{ steps.version.outputs.version }}
      - name: Package library
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          go run ./.github/scripts/package-release.go -library dist/windows-arm64/cpa-opencode.dll \
            -archive "dist/cpa-opencode_${VERSION}_windows_arm64.zip" -checksum dist/checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cpa-opencode-windows-arm64
          path: |
            dist/*.zip
            dist/checksums.txt
          if-no-files-found: error

  build-freebsd:
    needs: test
    runs-on: ubuntu-24.04
    env:
      FREEBSD_VERSION: '14.4'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            cc_arch: x86_64
            # From the release's amd64/amd64/14.4-RELEASE/MANIFEST.
            base_sha256: 769f60a6eea2938ad6b7943cfbcc17dfaf7d1f7ba59a32b869a00349302df853
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare FreeBSD sysroot
        timeout-minutes: 15
        env:
          FREEBSD_ARCH: ${{ matrix.arch }}
          FREEBSD_BASE_SHA256: ${{ matrix.base_sha256 }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld
          base_archive="$RUNNER_TEMP/freebsd-base.txz"
          sysroot="$RUNNER_TEMP/freebsd-sysroot"
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 180 \
            --output "$base_archive" \
            "https://download.freebsd.org/releases/$FREEBSD_ARCH/$FREEBSD_ARCH/$FREEBSD_VERSION-RELEASE/base.txz"
          printf '%s  %s\n' "$FREEBSD_BASE_SHA256" "$base_archive" | sha256sum --check
          mkdir -p "$sysroot"
          tar --extract --xz --file "$base_archive" --directory "$sysroot" --no-same-owner ./usr/include ./usr/lib ./lib
          echo "FREEBSD_SYSROOT=$sysroot" >> "$GITHUB_ENV"
      - name: Build library and package
        timeout-minutes: 45
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          FREEBSD_CC_ARCH: ${{ matrix.cc_arch }}
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          version=0.0.0-dev
          if [[ "$REF_TYPE" == tag ]]; then version="${RELEASE_TAG#v}"; fi
          mkdir -p dist
          library="dist/cpa-opencode.so"
          archive="dist/cpa-opencode_${version}_freebsd_${TARGET_ARCH}.zip"
          CC="clang --target=${FREEBSD_CC_ARCH}-unknown-freebsd${FREEBSD_VERSION} --sysroot=${FREEBSD_SYSROOT}" \
            CGO_LDFLAGS=-fuse-ld=lld CGO_ENABLED=1 GOOS=freebsd GOARCH="$TARGET_ARCH" \
            go build -trimpath -buildmode=c-shared \
            -ldflags "-s -w -X github.com/dillonzq/cpa-opencode/internal/plugin.pluginVersion=$version" -o "$library" .
          go run ./.github/scripts/package-release.go -library "$library" -archive "$archive" -checksum dist/checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cpa-opencode-freebsd-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/checksums.txt
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test, build, build-windows-arm64, build-freebsd]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v5
        with:
          pattern: cpa-opencode-*
          path: release-packages
      - name: Assemble release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp release-packages/*/*.zip release-assets/
          LC_ALL=C sort -k2 release-packages/*/checksums.txt > release-assets/checksums.txt
      - name: Prepare release notes
        run: go run ./.github/scripts/release-notes -notes RELEASE_NOTES.md -tag "$RELEASE_TAG" -out "$RUNNER_TEMP/release-notes.md"
      - name: Verify release packages
        working-directory: release-assets
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          test "$(find . -maxdepth 1 -name '*.zip' | wc -l)" -eq 7
          test "$(wc -l < checksums.txt)" -eq 7
          diff -u <(printf '%s\n' *.zip | LC_ALL=C sort) \
            <(awk '{print $2}' checksums.txt | LC_ALL=C sort)
          sha256sum --check --strict checksums.txt
          for target in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64 windows_amd64 windows_arm64 freebsd_amd64; do
            archive="cpa-opencode_${version}_${target}.zip"
            test -s "$archive"
            unzip -t "$archive"
            case "$target" in
              linux_* | freebsd_*) ext=so ;;
              darwin_*) ext=dylib ;;
              windows_*) ext=dll ;;
            esac
            diff -u <(printf '%s\n' LICENSE "cpa-opencode.$ext" | LC_ALL=C sort) \
              <(unzip -Z1 "$archive" | LC_ALL=C sort)
          done
      - name: Create or update release draft
        run: |
          set -euo pipefail
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft'); then
            if [[ "$draft" != true ]]; then
              echo "Refusing to modify an already published release: $RELEASE_TAG" >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" release-assets/*.zip release-assets/checksums.txt --clobber
            # Remove checksum sidecars left by older workflow runs of this draft.
            gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name | select(endswith(".zip.sha256"))' |
              while IFS= read -r asset; do
                gh release delete-asset "$RELEASE_TAG" "$asset" --yes
              done
            gh release edit "$RELEASE_TAG" --draft --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$RELEASE_TAG" release-assets/*.zip release-assets/checksums.txt \
              --draft --verify-tag --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
