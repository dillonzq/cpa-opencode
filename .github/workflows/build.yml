name: Build

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Download native host dependencies
        run: go mod download all
      - name: Formatting
        run: test -z "$(gofmt -l main.go internal tests .github/scripts)"
      - name: Production tests
        run: go test ./... ./.github/scripts/...
      - name: Native host integration
        run: go test -tags debug ./...
      - name: Race detector
        run: go test -tags debug -race ./...
      - name: Vet
        run: go vet -tags debug ./... ./.github/scripts/...
      - name: Validate tagged release notes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          go run ./.github/scripts/release-notes -notes RELEASE_NOTES.md -tag "$RELEASE_TAG" -out "$RUNNER_TEMP/release-notes.md"
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
            ext: so
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            ext: so
          - os: darwin
            arch: amd64
            runner: macos-15-intel
            ext: dylib
          - os: darwin
            arch: arm64
            runner: macos-15
            ext: dylib
          - os: windows
            arch: amd64
            runner: windows-2025
            ext: dll
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build library and package
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
          LIB_EXT: ${{ matrix.ext }}
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          version=0.0.0-dev
          if [[ "$REF_TYPE" == tag ]]; then version="${RELEASE_TAG#v}"; fi
          mkdir -p dist
          library="dist/cpa-opencode.$LIB_EXT"
          archive="dist/cpa-opencode_${version}_${TARGET_OS}_${TARGET_ARCH}.zip"
          CGO_ENABLED=1 GOOS="$TARGET_OS" GOARCH="$TARGET_ARCH" go build -trimpath -buildmode=c-shared \
            -ldflags "-s -w -X github.com/dillonzq/cpa-opencode/internal/plugin.pluginVersion=$version" -o "$library" .
          go run ./.github/scripts/package-release.go -library "$library" -archive "$archive" -checksum "$archive.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: cpa-opencode-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
